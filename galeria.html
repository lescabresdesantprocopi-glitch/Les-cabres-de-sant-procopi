<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeria | Les Cabres de Sant Procopi</title>

    <link rel="stylesheet" href="css/estil.css">

    <style>
        .galeria-contenidor {
            width: min(1100px, 92%);
            margin: 40px auto;
        }

        .galeria-contenidor h2 {
            color: #ff7a1a;
            margin: 35px 0 20px;
        }

        .galeria-fotos {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .galeria-fotos a {
            display: block;
            overflow: hidden;
            border-radius: 10px;
        }

        .galeria-fotos img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .galeria-fotos a:hover img {
            transform: scale(1.04);
        }

        .contenidor-carrusel {
            display: grid;
            grid-template-columns: auto minmax(0, 750px) auto;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 30px auto 50px;
        }

        .carrusel-fotos {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-width: 0;
        }

        .foto-carrusel {
            display: none;
            width: 100%;
            max-height: 480px;
            object-fit: contain;
            border-radius: 12px;
            cursor: pointer;
        }

        .foto-carrusel.activa {
            display: block;
        }

        .contenidor-carrusel button {
            background: #ff7a1a;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
        }

        .contenidor-carrusel button:hover {
            background: #d95e0d;
        }

        .missatge-error {
            color: #ff9a58;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 700px) {
            .galeria-fotos {
                grid-template-columns: 1fr;
            }

            .galeria-fotos img {
                height: 240px;
            }

            .contenidor-carrusel {
                grid-template-columns: auto minmax(0, 1fr) auto;
                gap: 8px;
            }

            .contenidor-carrusel button {
                padding: 9px 11px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">
                <img src="imatges/logo.png" alt="Les Cabres de Sant Procopi" class="logo-img">
            </a>

            <ul>
                <li><a href="index.html">Inici</a></li>
                <li><a href="associacio.html">Qui som</a></li>
                <li><a href="activitats.html">Activitats</a></li>
                <li><a href="galeria.html" class="actiu">Galeria</a></li>
                <li><a href="botiga.html">La nostra botiga</a></li>
                <li><a href="loteria.html">Loteria</a></li>
                <li><a href="contacte.html">Contacte</a></li>
                <li><a href="ubicacio.html">Ubicació</a></li>
                <li><a href="normes.html">Normes de seguretat</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="galeria-contenidor">
            <h1>Galeria</h1>

            <h2>Els nostres moments</h2>

            <div id="galeria-fotos" class="galeria-fotos"></div>

            <h2>Més fotografies</h2>

            <div class="contenidor-carrusel">
                <button id="foto-anterior" type="button" aria-label="Fotografia anterior">
                    &#10094;
                </button>

                <div id="carrusel-fotos" class="carrusel-fotos"></div>

                <button id="foto-seguent" type="button" aria-label="Fotografia següent">
                    &#10095;
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Les Cabres de Sant Procopi</p>
    </footer>

    <script src="galeria.js"></script>

</body>

</html>
